<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Monopoly Vision</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <h1>Monopoly Vision</h1>
</header>

<main>
    <section class="vision-section">
        <div class="camera-container" id="camContainer">
            <div class="video-frame">
                <img id="video-feed" src="{{ url_for('video_bp.video_feed') }}" alt="Live Video Feed">
            </div>
        </div>

        <div class="status-box" id="statusBox">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Recherche du plateau...</span>
        </div>
    </section>

    <aside class="game-panel">
        <h2>État de la partie</h2>

        <div id="playersContainer" class="players-grid">
            </div>

        <div class="game-logs" id="logsContainer">
            <div class="log-entry">En attente du début...</div>
        </div>

        <div class="controls">
            <button id="btnStart" class="btn-roll" onclick="startGame()" style="background-color: #8e44ad; font-size: 1.2rem; margin-bottom: 10px;">
                🏁 Démarrer la Partie
            </button>

            <button id="btnBuy" class="btn-roll" onclick="buyProperty()" style="background-color: #27ae60; display: none; margin-bottom: 10px;">
                Acheter la Propriété 🏠
            </button>

            <button id="btnRoll" class="btn-roll" onclick="rollDice()" style="display:none;">Lancer Manuel 🎲</button>

            <button id="btnNext" class="btn-roll" onclick="nextTurn()" style="background-color: #e67e22; margin-top: 10px; display:none;">
                Tour Suivant >>
            </button>
        </div>
    </aside>
</main>

<footer>
    <p>Created by <strong>Tikam & Tikom</strong> — 2025</p>
</footer>

<script>
    // --- GESTION CAMERA ---
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const camContainer = document.getElementById('camContainer');
    const statusBox = document.getElementById('statusBox');

    function checkVisionStatus() {
        fetch('/status?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                if (data.detected) {
                    if (statusText.innerText !== "Plateau Détecté !") {
                        statusText.innerText = "Plateau Détecté !";
                        statusDot.style.backgroundColor = "#2ecc71";
                        camContainer.classList.add('detected');
                        statusBox.classList.add('detected');
                    }
                } else {
                    if (statusText.innerText !== "Recherche...") {
                        statusText.innerText = "Recherche...";
                        statusDot.style.backgroundColor = "#e74c3c";
                        camContainer.classList.remove('detected');
                        statusBox.classList.remove('detected');
                    }
                }
            });
    }

    // --- GESTION JEU ---
    const playersContainer = document.getElementById('playersContainer');
    const logsContainer = document.getElementById('logsContainer');
    const btnRoll = document.getElementById('btnRoll');

  function startGame() {
        fetch('/game/start')
            .then(res => res.json())
            .then(data => updateGameState());
    }

    function updateGameState() {
        fetch('/game/state?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                renderPlayers(data.players, data.current_player.id);
                renderLogs(data.logs);

                const btnStart = document.getElementById('btnStart');
                const btnRoll = document.getElementById('btnRoll');
                const btnNext = document.getElementById('btnNext');
                const btnBuy = document.getElementById('btnBuy');

                // CAS 1 : PARTIE NON COMMENCÉE
                if (data.game_state === "NOT_STARTED") {
                    btnStart.style.display = "block";
                    btnRoll.style.display = "none";
                    btnNext.style.display = "none";
                    btnBuy.style.display = "none";
                    return; // On arrête là, pas besoin de gérer le reste
                }

                // CAS 2 : PARTIE EN COURS
                btnStart.style.display = "none"; // On cache le bouton start

                // Gestion du bouton ACHETER
                if (data.game_state === "CAN_BUY") {
                    btnBuy.style.display = "block";
                    if (data.current_square) {
                        btnBuy.innerText = `Acheter ${data.current_square.name} (${data.current_square.price} $)`;
                    }
                    btnRoll.style.display = "none";
                } else {
                    btnBuy.style.display = "none";
                    btnRoll.style.display = "block"; // On réaffiche le lancer manuel au cas où
                }

                btnRoll.innerText = `Au tour de ${data.current_player.name} (Lancer)`;

                // Gestion du bouton TOUR SUIVANT
                btnNext.style.display = "block";
                if (data.game_state === "WAITING_ROLL") {
                    btnNext.disabled = true;
                    btnNext.style.opacity = "0.5";
                    btnRoll.disabled = false;
                } else {
                    btnNext.disabled = false;
                    btnNext.style.opacity = "1";
                    btnRoll.disabled = true;
                }
            })
            .catch(e => console.log("Jeu pas encore prêt"));
    }

    function renderPlayers(players, currentId) {
        playersContainer.innerHTML = '';
        players.forEach(p => {
            const isActive = p.id === currentId;
            const card = document.createElement('div');
            card.className = `player-card ${isActive ? 'active' : ''}`;
            // Bordure colorée selon le joueur
            card.style.borderLeftColor = isActive ? '#f1c40f' : p.color;

            card.innerHTML = `
                <div class="player-header">
                    <span class="p-name" style="color:${p.color}">${p.name}</span>
                    <span class="p-money">${p.money} $</span>
                </div>
                <div class="p-pos">Position: Case ${p.position}</div>
            `;
            playersContainer.appendChild(card);
        });
    }

    function renderLogs(logs) {
        logsContainer.innerHTML = logs.map(log => `<div class="log-entry">> ${log}</div>`).join('');
    }

    function rollDice() {
        btnRoll.disabled = true;
        fetch('/game/roll')
            .then(res => res.json())
            .then(data => {
                updateGameState();
                setTimeout(() => btnRoll.disabled = false, 1000);
            });
    }

    function nextTurn() {
        console.log("Clic sur Tour Suivant");
        fetch('/game/next-turn')
            .then(res => res.json())
            .then(data => {
                console.log("Tour passé !");
                updateGameState(); // On rafraîchit l'affichage tout de suite
            })
            .catch(err => console.error("Erreur:", err));
    }
    function buyProperty() {
        fetch('/game/buy')
            .then(res => res.json())
            .then(data => {
                console.log(data.message);
                updateGameState(); // On rafraîchit pour cacher le bouton Achat
            });
    }

    // Boucles
    setInterval(checkVisionStatus, 500);
    setInterval(updateGameState, 1000);
</script>

</body>
</html>
